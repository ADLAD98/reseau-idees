<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark">
<!-- la page ne charge de code que depuis ce site, et ne parle qu'au serveur du jeu (même adresse que dans js/config.js) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com; connect-src 'self' https://jeu-cartes.jeu-cartes-serveur.workers.dev http://127.0.0.1:8787; base-uri 'none'; form-action 'none'">
<title>Roster · Bcorps Labs</title>
<meta name="description" content="Jeu de cartes e-sport : ouvre des packs et collectionne les joueurs et coachs pros de la saison.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2305070b'/%3E%3Cpath d='M24 10h42l12 12v68H36L24 78z' fill='none' stroke='%2300e5ff' stroke-width='6'/%3E%3Ccircle cx='51' cy='50' r='13' fill='none' stroke='%2300e5ff' stroke-width='7'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../../img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ddragon.leagueoflegends.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="fx">

<!-- dessins réutilisés partout : emblème, pictogrammes, fonds des cartes sans illustration -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 100 100">
    <path d="M24 9h42l12 12v70H36L24 79z" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="51" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="7"/>
    <path d="M51 22v7M51 71v7" fill="none" stroke="currentColor" stroke-width="5"/>
  </symbol>
  <symbol id="i-pack" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM6 7h12M10 12h4M10 15h4"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><path d="M8 4h11v15H8zM5 7v13h11"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 20v-8h5v8M9.5 20V5h5v15M15 20v-5h5v5M3 20h18"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
  <!-- carte d'un coach : un tableau tactique -->
  <symbol id="art-coach" viewBox="0 0 250 350">
    <g fill="none" stroke="currentColor">
      <rect x="35" y="38" width="180" height="180" stroke-width="1.5" opacity=".5"/>
      <path d="M50 203V70q0-15 15-15h135" stroke-width="6" opacity=".24"/>
      <path d="M50 203h135q15 0 15-15V55" stroke-width="6" opacity=".24"/>
      <path d="M50 203L200 53" stroke-width="6" opacity=".24"/>
      <path d="M45 48q60 40 80 80t80 80" stroke-width="2" stroke-dasharray="3 6" opacity=".5"/>
      <rect x="40" y="189" width="24" height="24" stroke-width="2" opacity=".9"/>
      <rect x="186" y="43" width="24" height="24" stroke-width="2" opacity=".9"/>
      <circle cx="96" cy="116" r="11" stroke-width="2.5"/>
      <circle cx="150" cy="168" r="11" stroke-width="2.5"/>
      <path d="M118 94l14 14M132 94l-14 14M166 120l14 14M180 120l-14 14" stroke-width="2.5"/>
      <path d="M104 126q24 30 36 32" stroke-width="2" stroke-dasharray="5 4"/>
      <path d="M134 150l8 9-12 1" stroke-width="2"/>
      <path d="M72 178q30-46 58-62" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>
    </g>
  </symbol>
  <!-- carte d'un joueur sans partie jouée cette saison : une mire -->
  <symbol id="art-none" viewBox="0 0 250 350">
    <g fill="none" stroke="currentColor">
      <circle cx="125" cy="122" r="64" stroke-width="1.5" opacity=".5"/>
      <circle cx="125" cy="122" r="40" stroke-width="7" opacity=".3"/>
      <path d="M125 36v38M125 170v38M39 122h38M173 122h38" stroke-width="2" opacity=".6"/>
      <path d="M57 54l14 14M193 54l-14 14M57 190l14-14M193 190l-14-14" stroke-width="1.5" opacity=".4"/>
    </g>
  </symbol>
</svg>

<div id="app"><div class="center"><div><div class="spin"></div>Chargement…</div></div></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Ce jeu a besoin de JavaScript pour fonctionner.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
